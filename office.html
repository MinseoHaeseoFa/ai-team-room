<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe2cf">
<title>🏢 3D 오피스 — 김팀장 중앙 총괄 (PolyCode Team)</title>
<meta name="description" content="쿠사리 대표님의 3D 미니어처 오피스 — 김팀장 중앙 총괄석, 비서실 존, 폴리코드팀 존, 회의·휴게공간을 한눈에.">
<style>
  :root{
    --ink:#12141a; --ink2:#1a1d25; --line:rgba(255,255,255,.14);
    --text:#f2f5fa; --muted:#a9b2c1; --accent:#ff5c8a; --accent2:#ffd166;
    --ok:#4ade80; --warn:#fbbf24; --off:#9aa3b2;
    --glass:rgba(17,20,27,.74); --glass-2:rgba(24,28,37,.86);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#efe2cf; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  a{color:inherit}

  /* ---------- 3D stage ---------- */
  #stage{position:fixed;inset:0;touch-action:none}
  #stage canvas{display:block;width:100%;height:100%;outline:none}

  .hud{position:fixed;z-index:20}

  /* ---------- top bar ---------- */
  .topbar{
    top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px 0;pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .brand{
    display:flex;align-items:center;gap:10px;padding:9px 14px 9px 12px;
    background:var(--glass);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
    box-shadow:0 10px 30px rgba(10,12,18,.28);
  }
  .brand .mark{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(150deg,#ff9ec4,#ff5c8a 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .brand b{display:block;font-size:14.5px;letter-spacing:.1px}
  .brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px;word-break:keep-all}

  .topright{margin-left:auto;display:flex;align-items:center;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:20px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);font-size:12px;color:#dfe5ee;white-space:nowrap;cursor:default;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--off);box-shadow:0 0 0 3px rgba(154,163,178,.16);transition:background .25s}
  .chip.live .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  .chip.offline .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.16)}
  .chip button{font-size:11.5px;color:#ffd7e5;text-decoration:underline;text-underline-offset:3px}
  .hud-link{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;text-decoration:none;
    padding:8px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#ffe3ec;white-space:nowrap;
    transition:background .18s,border-color .18s;
  }
  .hud-link:hover{background:rgba(58,31,42,.86);border-color:var(--accent)}
  .hud-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- camera presets ---------- */
  .presets{
    left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;
    background:var(--glass);border:1px solid var(--line);border-radius:22px;
    backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
    box-shadow:0 12px 34px rgba(10,12,18,.3);max-width:calc(100vw - 24px);
  }
  .presets button{
    padding:8px 13px;border-radius:16px;font-size:12.5px;font-weight:600;color:#c9d1dd;
    white-space:nowrap;transition:background .16s,color .16s;
  }
  .presets button:hover{background:rgba(255,255,255,.08);color:#fff}
  .presets button[aria-pressed="true"]{background:linear-gradient(150deg,#ff8fb4,#ff5c8a);color:#fff;box-shadow:0 4px 14px rgba(255,92,138,.32)}
  .presets button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .presets button .short{display:none}

  .hint{
    left:16px;bottom:22px;font-size:11.5px;color:#584739;max-width:238px;line-height:1.55;
    background:rgba(255,251,243,.66);border:1px solid rgba(140,110,86,.16);
    padding:8px 11px;border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .hint b{color:#42342a}

  /* ---------- inspector ---------- */
  .inspector{
    position:fixed;z-index:22;
    top:78px;right:16px;width:340px;max-height:calc(100vh - 120px);overflow:auto;
    background:var(--glass-2);border:1px solid var(--line);border-radius:var(--radius);
    backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
    box-shadow:0 18px 50px rgba(8,10,16,.42);
    transform:translateX(calc(100% + 24px));opacity:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .24s;
    padding:16px 16px 14px;
  }
  .inspector.show{transform:none;opacity:1}
  .inspector::-webkit-scrollbar{width:8px}
  .inspector::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
  .ins-head{display:flex;align-items:flex-start;gap:11px}
  .ins-avatar{
    flex:0 0 44px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);
  }
  .ins-title{min-width:0;flex:1}
  .ins-title h2{margin:0;font-size:16px;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ins-title p{margin:2px 0 0;font-size:12px;color:var(--muted);word-break:break-word}
  .ins-close{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:16px;background:transparent}
  .ins-close:hover{background:rgba(255,255,255,.1);color:#fff}
  .state{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    border:1px solid rgba(255,255,255,.18);color:#cfd6e1;
  }
  .state.active{color:#0d1a12;background:#8ef0b0;border-color:#8ef0b0}
  .state.recent{color:#1b1403;background:#ffd98a;border-color:#ffd98a}
  .state.idle{color:#2a2f38;background:#c9d0da;border-color:#c9d0da}
  .state.hiring{color:#1b1403;background:#ffd98a;border-color:#ffd98a}
  .state.planned{color:#2a2f38;background:#d7dde6;border-color:#d7dde6}

  .ins-sec{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)}
  .ins-sec h3{margin:0 0 7px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .ins-sec p{margin:0;font-size:13px;color:#dbe1ea;word-break:keep-all}
  .ins-sec .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .quote{
    margin:0;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.05);
    border-left:3px solid var(--accent);font-size:12.5px;color:#dfe5ee;line-height:1.6;
    max-height:170px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }
  .quote .who{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  }
  .row .hash{color:var(--muted);font-size:12px}
  .row .nm{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm .role{color:var(--muted);font-size:11px;font-weight:600;margin-left:3px}
  .row .cnt{margin-left:auto;font-size:11px;color:#cfd6e1;background:rgba(255,255,255,.1);border-radius:9px;padding:1px 7px;white-space:nowrap}
  .row .go{font-size:11px;color:#ffd7e5;background:rgba(255,92,138,.18);border:1px solid rgba(255,92,138,.38);border-radius:9px;padding:3px 8px;text-decoration:none;white-space:nowrap}
  .row .go:hover{background:rgba(255,92,138,.3)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
    padding:9px 12px;border-radius:11px;font-size:12.5px;font-weight:700;text-decoration:none;
    background:linear-gradient(150deg,#ff8fb4,#ff5c8a);color:#fff;box-shadow:0 6px 18px rgba(255,92,138,.26);
  }
  .btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e6ecf5;box-shadow:none}
  .btn + .btn{margin-top:7px}
  .meta-line{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}

  /* ---------- speech bubble ---------- */
  #bubbleLayer{position:fixed;inset:0;pointer-events:none;z-index:18;overflow:hidden}
  .bubble{
    position:absolute;left:0;top:0;width:max-content;max-width:250px;transform:translate(-50%,-100%);
    background:#fffdf8;color:#24262c;border-radius:14px;padding:9px 12px;font-size:12.5px;line-height:1.5;
    box-shadow:0 10px 26px rgba(20,16,12,.28);border:1px solid rgba(0,0,0,.06);
    opacity:0;transition:opacity .18s;word-break:keep-all;
  }
  .bubble.show{opacity:1}
  .bubble b{display:block;font-size:11px;color:#8a6a58;margin-bottom:2px}
  .bubble:after{
    content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fffdf8;
    transform:translateX(-50%) rotate(45deg);border-right:1px solid rgba(0,0,0,.06);border-bottom:1px solid rgba(0,0,0,.06);
  }

  /* ---------- gate ---------- */
  .gate{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px;
    background:rgba(12,14,19,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .gate[hidden]{display:none}
  .gate .card{
    width:100%;max-width:356px;background:var(--ink2);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .gate h2{margin:0 0 5px;font-size:17px;display:flex;align-items:center;gap:8px}
  .gate p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.6;word-break:keep-all}
  .gate input{
    width:100%;background:#0e1117;border:1px solid var(--line);border-radius:12px;color:var(--text);
    padding:11px 12px;font-size:14px;outline:none;
  }
  .gate input:focus{border-color:var(--accent)}
  .gate .go{width:100%;margin-top:9px;padding:11px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
  .gate .row2{display:flex;gap:8px;margin-top:9px}
  .gate .row2 .go{margin-top:0}
  .gate .err{color:#ff9aa9;font-size:12px;margin-top:9px;min-height:15px}

  /* ---------- loader / error ---------- */
  .loader{
    position:fixed;inset:0;z-index:55;display:grid;place-items:center;
    background:radial-gradient(1000px 600px at 50% 10%,#fbf1e2 0%,#efe2cf 55%,#e8d8c2 100%);
    transition:opacity .5s ease;
  }
  .loader.hide{opacity:0;pointer-events:none}
  .loader .box{text-align:center;color:#5a4a3c}
  .loader .spin{
    width:40px;height:40px;margin:0 auto 14px;border-radius:50%;
    border:3px solid rgba(90,74,60,.18);border-top-color:#d2691e;animation:sp 1s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .loader b{display:block;font-size:15px;margin-bottom:4px;color:#3f3227}
  .loader span{font-size:12.5px;opacity:.8}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    .topbar{padding:10px 10px 0;gap:7px}
    .brand{padding:7px 11px 7px 9px;border-radius:12px;gap:8px}
    .brand .mark{width:28px;height:28px;border-radius:9px;font-size:15px}
    .brand b{font-size:12.5px}
    .brand small{font-size:10px}
    .chip{padding:7px 10px;font-size:11px}
    .chip span.lbl{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hud-link{padding:7px 10px;font-size:11.5px}
    .presets{
      left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));transform:none;max-width:none;overflow-x:auto;
      justify-content:flex-start;border-radius:18px;padding:5px;scrollbar-width:none;
    }
    .presets::-webkit-scrollbar{display:none}
    .presets button{padding:8px 10px;font-size:12px}
    .presets button .full{display:none}
    .presets button .short{display:inline}
    .hint{display:none}
    .inspector{
      top:auto;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));width:auto;
      max-height:58vh;border-radius:18px;overscroll-behavior:contain;
      transform:translateY(calc(100% + 24px));padding:14px 14px 12px;
    }
    .inspector.show{transform:none}
    .ins-title h2{font-size:15px}
    .bubble{max-width:232px;font-size:12px;padding:8px 11px}
  }
  @media (prefers-reduced-motion:reduce){
    .inspector{transition:none}
    .bubble{transition:none}
  }
</style>
</head>
<body>
<div id="stage" aria-label="3D 오피스 장면"></div>
<div id="bubbleLayer"></div>

<header class="hud topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">🏢</span>
    <div>
      <b>3D 오피스</b>
      <small>김팀장 중앙 총괄 · 쿠사리 대표님</small>
    </div>
  </div>
  <div class="topright">
    <div class="chip" id="connChip" title="회의실 API 연결 상태">
      <span class="dot" aria-hidden="true"></span>
      <span class="lbl" id="connText">연결 확인 중…</span>
      <button type="button" id="connBtn" hidden>연결</button>
    </div>
    <a class="hud-link" href="/" title="폴리코드팀 회의실로 이동">💬 회의실</a>
  </div>
</header>

<nav class="hud presets" id="presets" aria-label="카메라 시점">
  <button type="button" data-view="all" aria-pressed="true">전체</button>
  <button type="button" data-view="kim" aria-pressed="false"><span class="full">김팀장 중앙석</span><span class="short">중앙석</span></button>
  <button type="button" data-view="secretariat" aria-pressed="false"><span class="full">비서실 존</span><span class="short">비서실</span></button>
  <button type="button" data-view="poly" aria-pressed="false"><span class="full">폴리코드팀 존</span><span class="short">폴리코드</span></button>
  <button type="button" data-view="common" aria-pressed="false"><span class="full">회의·휴게공간</span><span class="short">회의·휴게</span></button>
</nav>

<div class="hud hint">
  <b>드래그</b> 회전 · <b>스크롤</b> 확대 · <b>두 손가락</b> 이동<br>
  캐릭터·두 현황판·전화·회의공간을 눌러 보세요.
</div>

<aside class="inspector" id="inspector" aria-live="polite" aria-hidden="true"></aside>

<div class="gate" id="gate" hidden>
  <div class="card">
    <h2>🔑 회의실 연결</h2>
    <p>회의실 입장 비밀번호를 넣으면 현황판과 캐릭터 상태가 실시간으로 바뀝니다.<br>
       비밀번호는 이 브라우저에만 저장되고, 회의실(💬)과 같은 값을 씁니다.</p>
    <input id="gateInput" type="password" inputmode="text" autocomplete="current-password" placeholder="입장 비밀번호">
    <div class="row2">
      <button class="go" type="button" id="gateBtn">연결</button>
      <button class="go ghost" type="button" id="gateCancel" style="background:rgba(255,255,255,.07);color:#e6ecf5">나중에</button>
    </div>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <b>3D 오피스를 짓는 중…</b>
    <span>김팀장 총괄석과 두 현황판을 배치하고 있어요</span>
  </div>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#efe2cf;color:#3f3227;padding:24px;text-align:center">
    3D 오피스는 자바스크립트가 필요합니다. <a href="/">회의실로 이동</a>
  </div>
</noscript>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
<script type="module" src="./office.js"></script>
</body>
</html>
